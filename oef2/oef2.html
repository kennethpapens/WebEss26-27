<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/oef2.css" />
	<title>Smurfenstatistieken</title>
</head>
<body>
	<table>

		<caption>
			Smurfenstatistieken
		</caption>
			<thead>
			<tr>
				<td rowspan = "2">Smurf</td>
				<td colspan = "2">Activiteiten per week</td>
				<td rowspan="2">Favoriete kleur</td>
			</tr>
			<tr>
			<td>Avonturen</td>
			<td>Uitvindingen</td>
			</tr>
			</thead>
		<tr>
			<th>Grote Smurf</th>
			<td> 3 </td>
			<td> 1 </td>
			<td> Rood </td>
		</tr>
		<tr>
			<th>Brilsmurf</th>
			<td> 2 </td>
			<td> 2 </td>
			<td> Geel </td>
		</tr>
		<tr>
			<th>Knutselsmurf</th>
			<td> 1 </td>
			<td> 4 </td>
			<td> Groen </td>
		</tr>
		<tfoot>
			<tr>
				<th>Totaal</th>
				<td> 6 </td>
				<td> 7 </td>
				<td> 3 Kleuren </td>
			</tr>
		</tfoot>
			<!--
            Smurf        | Activiteiten per week    | Favoriete kleur
                         | Avonturen | Uitvindingen |
            Grote Smurf  | 3         | 1            | Rood
            Brilsmurf    | 2         | 2            | Geel
            Knutselsmurf | 1         | 4            | Groen
            Totaal       | 6         | 7            | 2 kleuren
            -->
	</table>
</body>
</html>
